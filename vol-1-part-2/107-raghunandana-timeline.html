        position: relative; height: 32px;
        background: var(--parchment-mid); border-radius: 4px;
        margin-bottom: 10px; overflow: hidden;
    }
    .eg-range-fill {
        position: absolute; top: 6px; height: 20px;
        background: var(--saffron); opacity: 0.3; border-radius: 3px;
    }
    .eg-range-dot {
        position: absolute; top: 11px; width: 10px; height: 10px;
        background: var(--saffron); border-radius: 50%;
        transform: translateX(-5px); cursor: pointer;

    .eg-range-dot:hover { transform: translateX(-5px) scale(1.4); }
    .eg-range-label {
        position: absolute; top: -2px;
        font-size: 0.7rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif;
