    :root {

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

    .navbar {

        display: flex;

        gap: 16px;

    .navbar a { color: var(--parchment); text-decoration: none; }

        padding: 10px 20px;
        margin-bottom: 24px;
        background: var(--parchment-mid);
        border-left: 4px solid var(--saffron);
        border-radius: 0 6px 6px 0;
    }
    .breadcrumb-bar a { color: var(--saffron); text-decoration: none; }
    .breadcrumb-bar a:hover { text-decoration: underline; }
    .content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
    }
    h1 {
        font-size: 1.6rem;
        margin-bottom: 8px;
        color: var(--ink);
    }
    .subtitle {
        font-size: 0.9rem;
        color: var(--ink-secondary);
        margin-bottom: 24px;
    }
    .timeline-container {
        overflow-x: auto;
        padding: 16px 0;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--parchment);
    }
    .timeline-svg {
        display: block;
        min-width: 100%;
    }
    .timeline-svg .tl-evt { cursor: pointer; }
    .timeline-svg .tl-evt:hover { transform: scale(1.5); }
    .event-list {
        margin-top: 32px;
    }
    .event-list h2 {
        font-size: 1.1rem;
        margin-bottom: 16px;
        color: var(--ink-secondary);
    }
    .event-item {
        display: flex;
        gap: 16px;
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
        font-size: 0.88rem;
    }
    .event-year {
        min-width: 90px;
        font-weight: 600;
        color: var(--saffron);
        font-family: 'Open Sans', sans-serif;
    }
    .event-label { font-weight: 600; }
    .event-context {
        color: var(--ink-secondary);
        font-size: 0.82rem;
        margin-top: 2px;
    }
    .event-link {
        color: var(--indigo);
        text-decoration: none;
        font-size: 0.8rem;
    }
    .event-link:hover { text-decoration: underline; }
    .back-link {
        display: inline-block;
        margin-top: 24px;
        color: var(--saffron);
        text-decoration: none;
        font-family: 'Open Sans', sans-serif;
    }
    .back-link:hover { text-decoration: underline; }
    .century-group {
        margin-bottom: 8px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        overflow: hidden;
    }
    .century-heading {
        display: block;
        padding: 10px 16px;
        background: var(--parchment-mid);
        cursor: pointer;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--ink);
    }
    .century-heading:hover { background: #e8dcc8; }
    .century-count {
        font-weight: 400;
        color: var(--ink-secondary);
        font-size: 0.82rem;
    }
    .century-events {

    }
    .vol-tl-link {
        display: inline-block;
        margin: 4px 8px 4px 0;
        padding: 6px 14px;
        background: var(--parchment-mid);
        border: 1px solid var(--rule);
        border-radius: 6px;
        color: var(--saffron);
        text-decoration: none;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.85rem;

    .vol-tl-link:hover {
        border-color: var(--saffron);
        background: #f5ebe0;
    }
    .vol-tl-count {
        color: var(--ink-secondary);
        font-size: 0.78rem;
    }

    .tl-tabs {

    }
    .tl-tab {

    .tl-panel.active { display: block; }

    .eg-entity {

        margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s;

        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px; background: var(--parchment-mid);
        cursor: pointer; font-family: 'Open Sans', sans-serif;
    }
    .eg-header:hover { background: #e8dcc8; }
    .eg-name { font-weight: 600; font-size: 0.92rem; flex: 1; }
    .eg-type {
        font-size: 0.72rem; padding: 2px 8px; border-radius: 10px;
        background: var(--parchment); color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .eg-claims-count {
        font-size: 0.78rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif;
    }
    .eg-body { padding: 12px 16px; display: none; }
    .eg-entity.open .eg-body { display: block; }
    .eg-range-bar {
        position: relative; height: 32px;
        background: var(--parchment-mid); border-radius: 4px;
        margin-bottom: 10px; overflow: hidden;
    }
    .eg-range-fill {
        position: absolute; top: 6px; height: 20px;
        background: var(--saffron); opacity: 0.3; border-radius: 3px;
    }
    .eg-range-dot {
        position: absolute; top: 11px; width: 10px; height: 10px;
        background: var(--saffron); border-radius: 50%;
        transform: translateX(-5px); cursor: pointer;
    }
    .eg-range-dot:hover { transform: translateX(-5px) scale(1.4); }
    .eg-range-label {
        position: absolute; top: -2px;
        font-size: 0.7rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif;
        transform: translateX(-50%);
    }
    .eg-cooccur {
        margin-top: 8px; padding-top: 8px;
        border-top: 1px solid var(--rule);
    }
    .eg-cooccur-title {
        font-size: 0.78rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif; margin-bottom: 6px;
    }
    .eg-cooccur-chip {
        display: inline-block; margin: 2px 4px 2px 0;
        padding: 3px 10px; background: var(--parchment-mid);
        border: 1px solid var(--rule); border-radius: 12px;
        font-size: 0.78rem; color: var(--ink);
        font-family: 'Open Sans', sans-serif;
        cursor: pointer; transition: all 0.2s;
    }
    .eg-cooccur-chip:hover { border-color: var(--saffron); color: var(--saffron); }
    .eg-cooccur-weight {
        font-size: 0.68rem; color: var(--ink-secondary); margin-left: 2px;
    }
    .eg-claim-list { margin-top: 8px; }
    .eg-claim {

        font-size: 0.82rem; border-bottom: 1px solid #f0e6d3;
    }
    .eg-claim-year {

    }

    .eg-claim a { color: var(--indigo); text-decoration: none; font-size: 0.76rem; }
