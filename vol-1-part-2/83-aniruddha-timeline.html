    <style>
    :root {
        --parchment: #faf6ef;
        --parchment-mid: #f0e6d3;
        --saffron: #e8941a;
        --ink: #2c1810;
        --ink-secondary: #5a3e2b;
        --rule: #d4c5a9;
        --indigo: #2d5a87;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Lora', Georgia, serif;
        background: var(--parchment);
        color: var(--ink);
    }
    .navbar {
        background: linear-gradient(135deg, #1a0f0a, #2c1810);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .navbar a { color: var(--parchment); text-decoration: none; }
    .navbar .devanagari { font-size: 1.3rem; }
    .navbar .nav-title { font-family: 'Lora', serif; font-size: 1rem; opacity: 0.9; }
    .breadcrumb-bar {
        font-family: 'Open Sans', sans-serif;
        font-size: 0.85rem;
        padding: 10px 20px;
        margin-bottom: 24px;
        background: var(--parchment-mid);
        border-left: 4px solid var(--saffron);
        border-radius: 0 6px 6px 0;
    }
    .breadcrumb-bar a { color: var(--saffron); text-decoration: none; }
    .breadcrumb-bar a:hover { text-decoration: underline; }
    .content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
    }
    h1 {
        font-size: 1.6rem;
        margin-bottom: 8px;
        color: var(--ink);
    }
    .subtitle {
        font-size: 0.9rem;
        color: var(--ink-secondary);
        margin-bottom: 24px;
    }
    .timeline-container {
        overflow-x: auto;
        padding: 16px 0;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--parchment);
    }
    .timeline-svg {
        display: block;
        min-width: 100%;
    }
    .timeline-svg .tl-evt { cursor: pointer; }
    .timeline-svg .tl-evt:hover { transform: scale(1.5); }
    .event-list {
        margin-top: 32px;
    }
    .event-list h2 {
        font-size: 1.1rem;
        margin-bottom: 16px;
        color: var(--ink-secondary);
    }
    .event-item {
        display: flex;
        gap: 16px;
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
        font-size: 0.88rem;
    }
    .event-year {
        min-width: 90px;
        font-weight: 600;
        color: var(--saffron);
        font-family: 'Open Sans', sans-serif;
    }
    .event-label { font-weight: 600; }
    .event-context {
        color: var(--ink-secondary);
        font-size: 0.82rem;
        margin-top: 2px;
    }
    .event-link {
        color: var(--indigo);
        text-decoration: none;
        font-size: 0.8rem;
    }
    .event-link:hover { text-decoration: underline; }
    .back-link {
        display: inline-block;
        margin-top: 24px;
        color: var(--saffron);
        text-decoration: none;
        font-family: 'Open Sans', sans-serif;
    }
    .back-link:hover { text-decoration: underline; }
    .century-group {
        margin-bottom: 8px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        overflow: hidden;
    }
    .century-heading {
        display: block;
        padding: 10px 16px;
        background: var(--parchment-mid);
        cursor: pointer;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--ink);
    }
    .century-heading:hover { background: #e8dcc8; }
    .century-count {
        font-weight: 400;
        color: var(--ink-secondary);
        font-size: 0.82rem;
    }
    .century-events {
        padding: 8px 16px;
    }
    .vol-tl-link {
        display: inline-block;
        margin: 4px 8px 4px 0;
        padding: 6px 14px;
        background: var(--parchment-mid);
        border: 1px solid var(--rule);
        border-radius: 6px;
        color: var(--saffron);
        text-decoration: none;
        font-family: 'Open Sans', sans-serif;
        font-size: 0.85rem;
    }
    .vol-tl-link:hover {
        border-color: var(--saffron);
        background: #f5ebe0;
    }
    .vol-tl-count {
        color: var(--ink-secondary);
        font-size: 0.78rem;
    }
    /* ── Tab switcher ── */
    .tl-tabs {
        display: flex; gap: 0; margin-bottom: 20px;
        border-bottom: 2px solid var(--rule);
    }
    .tl-tab {
        padding: 10px 20px; cursor: pointer;
        font-family: 'Open Sans', sans-serif; font-size: 0.9rem;
        color: var(--ink-secondary); border-bottom: 2px solid transparent;
        margin-bottom: -2px; transition: all 0.2s;
    }
    .tl-tab:hover { color: var(--ink); }
    .tl-tab.active { color: var(--saffron); border-bottom-color: var(--saffron); font-weight: 600; }
    .tl-panel { display: none; }
    .tl-panel.active { display: block; }
    /* ── Entity graph styles ── */
    .eg-entity {
        border: 1px solid var(--rule); border-radius: 6px;
        margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s;
    }
    .eg-entity.highlighted { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
    .eg-header {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px; background: var(--parchment-mid);
        cursor: pointer; font-family: 'Open Sans', sans-serif;
    }
    .eg-header:hover { background: #e8dcc8; }
    .eg-name { font-weight: 600; font-size: 0.92rem; flex: 1; }
    .eg-type {
        font-size: 0.72rem; padding: 2px 8px; border-radius: 10px;
        background: var(--parchment); color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .eg-claims-count {
        font-size: 0.78rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif;
    }
    .eg-body { padding: 12px 16px; display: none; }
    .eg-entity.open .eg-body { display: block; }
    .eg-range-bar {
        position: relative; height: 32px;
        background: var(--parchment-mid); border-radius: 4px;
        margin-bottom: 10px; overflow: hidden;
    }
    .eg-range-fill {
        position: absolute; top: 6px; height: 20px;
        background: var(--saffron); opacity: 0.3; border-radius: 3px;
    }
    .eg-range-dot {
        position: absolute; top: 11px; width: 10px; height: 10px;
        background: var(--saffron); border-radius: 50%;
        transform: translateX(-5px); cursor: pointer;
    }
    .eg-range-dot:hover { transform: translateX(-5px) scale(1.4); }
    .eg-range-label {
        position: absolute; top: -2px;
        font-size: 0.7rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif;
        transform: translateX(-50%);
    }
    .eg-cooccur {
        margin-top: 8px; padding-top: 8px;
        border-top: 1px solid var(--rule);
    }
    .eg-cooccur-title {
        font-size: 0.78rem; color: var(--ink-secondary);
        font-family: 'Open Sans', sans-serif; margin-bottom: 6px;
    }
    .eg-cooccur-chip {
        display: inline-block; margin: 2px 4px 2px 0;
        padding: 3px 10px; background: var(--parchment-mid);
        border: 1px solid var(--rule); border-radius: 12px;
        font-size: 0.78rem; color: var(--ink);
        font-family: 'Open Sans', sans-serif;
        cursor: pointer; transition: all 0.2s;
    }
    .eg-cooccur-chip:hover { border-color: var(--saffron); color: var(--saffron); }
    .eg-cooccur-weight {
        font-size: 0.68rem; color: var(--ink-secondary); margin-left: 2px;
    }
    .eg-claim-list { margin-top: 8px; }
    .eg-claim {
        display: flex; gap: 12px; padding: 4px 0;
        font-size: 0.82rem; border-bottom: 1px solid #f0e6d3;
    }
    .eg-claim-year {
        min-width: 80px; font-weight: 600; color: var(--saffron);
        font-family: 'Open Sans', sans-serif; font-size: 0.8rem;
    }
    .eg-claim-ctx { color: var(--ink-secondary); font-size: 0.78rem; }
    .eg-claim a { color: var(--indigo); text-decoration: none; font-size: 0.76rem; }
    .eg-claim a:hover { text-decoration: underline; }
    .eg-stats {
        display: flex; gap: 24px; margin-bottom: 16px;
        font-family: 'Open Sans', sans-serif; font-size: 0.85rem;
        color: var(--ink-secondary);
    }
    .eg-stat-num { font-weight: 700; color: var(--saffron); font-size: 1.1rem; }
    .eg-sort {
        font-family: 'Open Sans', sans-serif; font-size: 0.82rem;
        margin-bottom: 12px; color: var(--ink-secondary);
    }
    .eg-sort a {
        color: var(--indigo); text-decoration: none; cursor: pointer;
        margin: 0 6px;
    }
    .eg-sort a:hover { text-decoration: underline; }
    .eg-sort a.active { color: var(--saffron); font-weight: 600; }

    <script>
    document.querySelectorAll('.tl-evt').forEach(function(el) {
        el.addEventListener('click', function() {
            var href = this.getAttribute('data-href');
            if (href) {
                window.location.href = href;
            } else {
                var paraId = this.getAttribute('data-para');
                if (paraId) {
                    var target = document.getElementById(paraId);
                    if (target) target.scrollIntoView({behavior: 'smooth'});
                }
            }
        });
    });
    // Tab switching
    document.querySelectorAll('.tl-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tl-tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tl-panel').forEach(function(p) { p.classList.remove('active'); });
            tab.classList.add('active');
            var panel = document.getElementById(tab.getAttribute('data-panel'));
            if (panel) panel.classList.add('active');
        });
    });
