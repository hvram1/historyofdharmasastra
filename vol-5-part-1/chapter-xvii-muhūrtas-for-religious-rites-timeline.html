<script>
function egToggle(header) {
    header.parentElement.classList.toggle('open');
}
function egHighlight(key) {
    // Remove existing highlights
    document.querySelectorAll('.eg-entity.highlighted').forEach(function(el) {
        el.classList.remove('highlighted');
    });
    // Highlight target and scroll to it
    var target = document.querySelector('.eg-entity[data-key="' + key + '"]');
    if (target) {
        target.classList.add('highlighted');
        target.classList.add('open');
        target.scrollIntoView({behavior: 'smooth', block: 'center'});
    }
}
function egSort(mode) {
    var container = document.getElementById('eg-entities');
    var items = Array.from(container.querySelectorAll('.eg-entity'));
    items.sort(function(a, b) {
        if (mode === 'date') return parseInt(a.dataset.consensus) - parseInt(b.dataset.consensus);
        if (mode === 'claims') return parseInt(b.dataset.claims) - parseInt(a.dataset.claims);
        if (mode === 'name') return a.dataset.name.localeCompare(b.dataset.name);
        return 0;
    });
    items.forEach(function(el) { container.appendChild(el); });
    // Update active sort link
    document.querySelectorAll('.eg-sort a').forEach(function(a) { a.classList.remove('active'); });
    event.target.classList.add('active');
}
</script>
